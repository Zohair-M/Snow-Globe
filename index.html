<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Snow Globe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mute / Unmute Button -->
    <button id="mute-btn">🔊 Mute</button>

    <!-- Snow Globe Container -->
    <div id="snow-globe" class="theme-night">
        <div id="particles"></div>
        
        <!-- Custom Shared Greeting Message -->
        <div id="greeting-message"></div>

        <div id="focal-point">⛄</div> 
        <div id="ground"></div>
    </div>

    <!-- Multi-Control Panel Dock -->
    <div id="control-panel">
        <!-- Wind Speed -->
        <div class="control-group">
            <label for="speed-slider">💨 Wind:</label>
            <input type="range" id="speed-slider" min="1" max="10" value="2">
        </div>

        <!-- Character Selector -->
        <div class="control-group">
            <label for="char-select">👤 Character:</label>
            <select id="char-select">
                <option value="⛄">⛄ Snowman</option>
                <option value="🎄">🎄 Holiday Tree</option>
                <option value="🏠">🏠 Cozy Cabin</option>
                <option value="🦌">🦌 Reindeer</option>
                <option value="🦖">🦖 Dino Winter</option>
                <option value="custom">✍️ Custom...</option>
            </select>
            <!-- Custom Character Text Input -->
            <input type="text" id="custom-char-input" placeholder="e.g. 🦄" maxlength="5" style="display: none;">
        </div>

        <!-- Weather Selector -->
        <div class="control-group">
            <label for="weather-select">🌨️ Weather:</label>
            <select id="weather-select">
                <option value="snow">❄️ Fluffy Snow</option>
                <option value="sparkles">✨ Magic Sparkles</option>
                <option value="hearts">💖 Love Flurry</option>
                <option value="leaves">🍁 Autumn Leaves</option>
                <option value="candy">🍬 Candy Storm</option>
                <option value="custom">✍️ Custom...</option>
            </select>
            <!-- Custom Weather Emojis Input -->
            <input type="text" id="custom-weather-input" placeholder="e.g. 🛸👾" maxlength="15" style="display: none;">
        </div>

        <!-- Sky Theme Selector + Upload -->
        <div class="control-group">
            <label for="theme-select">🎨 Sky Theme:</label>
            <select id="theme-select">
                <option value="theme-night">🌃 Midnight Blue</option>
                <option value="theme-sunset">🌅 Golden Sunset</option>
                <option value="theme-aurora">🌌 Northern Lights</option>
                <option value="theme-spooky">🎃 Spooky Night</option>
                <option value="custom">🎨 Custom Gradient...</option>
            </select>
            <!-- Color Pickers for Custom Gradient -->
            <span id="gradient-pickers" style="display: none;">
                <input type="color" id="gradient-color1" value="#3a1c71" class="color-swatch" title="Sky Color 1">
                <input type="color" id="gradient-color2" value="#ffaf7b" class="color-swatch" title="Sky Color 2">
            </span>
            <label for="bg-upload" class="upload-btn" title="Upload custom background image">📤</label>
            <input type="file" id="bg-upload" accept="image/*" style="display: none;">
        </div>

        <!-- Music Track Selector + Upload -->
        <div class="control-group">
            <label for="music-select">🎵 Music:</label>
            <select id="music-select">
                <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3">Cozy Chimes</option>
                <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Warm Melodies</option>
                <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">Retro Chill</option>
            </select>
            <label for="music-upload" class="upload-btn" title="Upload custom music track">📤</label>
            <input type="file" id="music-upload" accept="audio/*" style="display: none;">
        </div>

        <!-- Share Button -->
        <div class="control-group">
            <button id="share-btn" class="action-btn">🔗 Share Globe</button>
        </div>
    </div>

    <!-- Share Modal Popup -->
    <div id="share-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>📬 Send a Snowglobe Card</h3>
            <p style="font-size: 0.85rem; color: #ccc; margin-top: 5px;">Type a custom message to embed in your link:</p>
            <input type="text" id="share-msg-input" placeholder="e.g., Happy Holidays, Sarah! ❄️" maxlength="60">
            <button id="generate-link-btn" class="action-btn">Generate & Copy Link</button>
            <p id="share-status-msg"></p>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="bg-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" loop></audio>
    <audio id="shake-sound" src="Bell-ring.flac"></audio>
    
    <!-- tsParticles Library Link -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.0/tsparticles.bundle.min.js"></script>

    <!-- Custom JS Script -->
    <script src="script.js"></script>
</body>
</html>
